# APIC v3_2-A strict image-only CN vs AD screening, protocol revision 4.
preprocessing_version: skullstrip+n4+mni+crop+normalize
seed: 42
split_seed: 42
output_root: outputs/journal/apic_v3_2_screening_cn_ad

apic_v3_2_screening:
  method_family: APIC_v3_2
  code_variant: v3_2_balanced_style_memory
  implementation_status: prototype_not_protocol_compliant
  formal_run_allowed: false
  acquisition_input: false
  primary_variants: [ce_x, mixstyle_x, apic_v3_2_x]

claim:
  exclude_subjects_json: data/claim/paired_holdout_subjects.json
  exclude_subjects_key: subjects_all_paired
  protocol: apic_v3_2_screening_cn_ad
  protocol_revision: 4
  primary_metric: balanced_accuracy
  primary_baselines: [ce_x, mixstyle_x]
  split_seed: 42
  exclude_before_split: true
  carve_e3_from_target: true
task: {mode: binary, label_mapping: {1: 0, 3: 1}}

metadata_match: {max_days: 90, require_diagnosis_match: true, on_diagnosis_mismatch: exclude}
scan_manifest:
  enabled: true
  root: F:/ADNI/scan_manifests
  files: {ADNI: ADNI_scan_manifest.csv, NACC: NACC_scan_manifest.csv}
cohorts:
  ADNI:
    image_root: F:/ADNI/ADNI_dataset
    metadata_csv: D:/ADNI/merge.csv
    image_filename: MRI_brain_mni152_cropped_norm.nii.gz
    intensity_normalization: none
    sex_mapping: {1: male, 2: female, M: male, F: female}
    columns:
      id: [PTID, RID, subject_id]
      date: [EXAMDATE, VISDATE, date]
      sex: [PTGENDER, SEX, sex, gender]
      age: [AGE, age, AGE_YEARS]
      education: [PTEDUCAT, EDUCATION, education, EDU, EDUC]
      diagnosis: [DIAGNOSIS, DX, label]
  NACC:
    image_root: F:/ADNI/NACC_dataset
    metadata_csv: F:/NACC/MRI_mulclass3.csv
    image_filename: MRI_N4_brain_mni152_cropped_norm.nii.gz
    intensity_normalization: none
    sex_mapping: {1: male, 2: female, M: male, F: female}
    columns:
      id: [NACCID, PTID, subject_id]
      date: [date, EXAMDATE, VISDATE]
      sex: [SEX, sex, PTGENDER, gender]
      age: [AGE, age, AGE_YEARS]
      education: [EDUCATION, education, EDUC, EDU, EDUCATION_YEARS]
      diagnosis: [label, DIAGNOSIS, DX]

training:
  epochs: 50
  batch_size: 4
  eval_batch_size: 2
  num_workers: 0
  train_ratio: 0.6
  val_ratio: 0.2
  test_ratio: 0.2
  learning_rate: 0.0001
  weight_decay: 0.0001
  class_weighted_ce: true
model: {name: journal_resnet18, base_channels: 32, spatial_shape: [4, 4, 4], embedding_dim: 16, continuous_centers: 8, continuous_bases: 4, dropout: 0.1}
environments: {mode: age_sex, n_age_bins: 3, n_education_bins: 3, min_group_size: 8, min_per_class: 2, scale_continuous: true}
loss: {lambda_tv: 0.01, lambda_sparse: 0.001}
dual_shift:
  warm_clean_epochs: 5
  warm_apis_epochs: 5
  alpha_max: 0.25
  lambda_shift: 1.0
  lambda_js: 0.25
  lambda_feat: 0.1
  lambda_intervention: 0.0
  lambda_style: 0.1
  lambda_rms: 0.1
  rms_min: 0.001
  rms_max: 0.05
  # Bounds apply to prototype distance normalized by the mean source/target
  # calibration radius, not raw PCA distance.
  delta_min: 0.50
  delta_max: 3.00
  g_min: 0.20
  g_max: 0.80
  apis_basis_count: 4
  apis_rank: 8
  apis_style_dim: 16
  apis_memory_size: 4
  apis_memory_beta: 0.95
  apis_style_temperature: 0.5
  collapse_guard: {enabled: true, min_sensitivity: 0.15, min_specificity: 0.15, min_class_recall: 0.15}
  use_composite_selection: true
  subject_balanced_sampler: true
variants: [ce_x, mixstyle_x, apic_v3_2_x]
evaluation: {bootstrap_samples: 200, aggregate: subject_mean, cluster_by_subject: true, label_conflict: earliest_visit}
study: {directions: [ADNI_to_NACC, NACC_to_ADNI], seeds: [42, 43]}
