# DS-042: MRI+table cross-modal relation-preserving UDA.
# Resolve dataset and manifest roots on the server before running.
preprocessing_version: skullstrip+n4+mni+crop+normalize
seed: 42
split_seed: 42
output_root: outputs/journal/ds042_multimodal_uda_mci_ad
claim:
  protocol: ds042_multimodal_uda_scan_filtered_1p5t_mci_ad
  protocol_revision: 1
  primary_metric: balanced_accuracy
  split_seed: 42
  exclude_before_split: true
  task_pair: MCI_vs_AD
scan_filtered_protocol:
  enabled: true
  version: scan_filtered_v1_2026-08-08
  root: ./scan_manifests_filtered
  files: {ADNI: ADNI_1p5T_scan_filtered_manifest.csv, NACC: NACC_3T_scan_filtered_manifest.csv}
  expose_acquisition: false
task: {mode: binary, label_mapping: {2: 0, 3: 1}, class_names: {0: MCI, 1: AD}, positive_class: AD}
metadata_match: {max_days: 90, require_diagnosis_match: true, on_diagnosis_mismatch: exclude}
cohorts:
  ADNI:
    image_root: ./datasets/ADNI
    metadata_csv: ./metadata/ADNI.csv
    image_filename: MRI_brain_mni152_cropped_norm.nii.gz
    intensity_normalization: none
    sex_mapping: {1: male, 2: female, M: male, F: female}
    columns: {id: [PTID, RID, subject_id], date: [EXAMDATE, VISDATE, date], sex: [PTGENDER, SEX, sex, gender], age: [AGE, age, AGE_YEARS], education: [PTEDUCAT, EDUCATION, education, EDU, EDUC], diagnosis: [DIAGNOSIS, DX, label]}
  NACC:
    image_root: ./datasets/NACC
    metadata_csv: ./metadata/NACC.csv
    image_filename: MRI_N4_brain_mni152_cropped_norm.nii.gz
    intensity_normalization: none
    sex_mapping: {1: male, 2: female, M: male, F: female}
    columns: {id: [NACCID, PTID, subject_id], date: [date, EXAMDATE, VISDATE], sex: [SEX, sex, PTGENDER, gender], age: [AGE, age, AGE_YEARS], education: [EDUCATION, education, EDUC, EDU, EDUCATION_YEARS], diagnosis: [label, DIAGNOSIS, DX]}
training: {epochs: 50, batch_size: 4, eval_batch_size: 4, num_workers: 0, train_ratio: 0.6, val_ratio: 0.2, test_ratio: 0.2, learning_rate: 0.0001, weight_decay: 0.0001, class_weighted_ce: true}
model: {name: cmrp_uda}
cmrp_uda:
  preset: layer4_pixel
  layers: [1, 1, 1, 1]
  input_shape: [160, 196, 160]
  representation_dim: 128
  table_hidden_dim: 64
  dropout: 0.1
  max_adapter_strength: 0.1
  adaptation_fraction: 0.5
  adaptation_seed: 42
  target_aug_noise: 0.01
  lambda_task: 1.0
  lambda_source_relation: 0.1
  lambda_target_relation: 0.1
  lambda_alignment: 0.1
  lambda_prox: 0.0001
  lambda_identity: 0.1
  max_grad_norm: 5.0
  alignment_scope: mri_specific
environments: {mode: age_sex, n_age_bins: 3, n_education_bins: 3, min_group_size: 8, min_per_class: 2, scale_continuous: true}
dual_shift: {collapse_guard: {enabled: true, min_sensitivity: 0.15, min_specificity: 0.15, min_class_recall: 0.15}, subject_balanced_sampler: true}
evaluation: {bootstrap_samples: 1000, aggregate: subject_mean, cluster_by_subject: true, label_conflict: earliest_visit}
study: {directions: [ADNI_to_NACC], seeds: [42, 43, 44]}
variants:
  - cmrp_source_only
  - cmrp_uda
  - cmrp_joint_uda
  - cmrp_mri_specific
  - cmrp_table_specific
  - cmrp_both_specific
  - cmrp_no_source_relation
  - cmrp_no_target_relation
  - cmrp_no_alignment
  - cmrp_no_identity
  - cmrp_shuffled_table
  - cmrp_missingness_only
  - cmrp_table_only
